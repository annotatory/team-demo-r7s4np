<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nari 1 Revamp Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout concept: a quiet review desk around one phone. Left = the tour, centre = the phone (375 x 780), right = notes for the screen on show.
   Outer page follows the viewer's theme. The phone content is the frozen Nari 1 kit (light), with two dark surfaces: the lock screen and the Moment card. */
:root{
  --bg:#F4F1EB; --fg:#18151F; --muted:#67616D; --rail:#FFFEFB; --line:#DDD8CF; --accent:#4B46D8; --accent-fg:#FFFFFF; --tint:#E0DCE9; --ok:#0F6B57; --warn:#8A4B00;
  /* kit, frozen (R105) */
  --mineral:#F4F1EB; --surface:#FFFEFB; --subtle:#ECE9E2; --bsoft:#DDD8CF; --bstrong:#8A857D; --carbon:#18151F; --t2:#67616D;
  --indigo:#4B46D8; --indigo7:#3C37A0; --itint:#E0DCE9; --coral:#F15D45; --ctint:#F4DCD4; --pos:#0F6B57; --cau:#8A4B00; --crit:#B9363E;
  --dk1:#18151F; --dk2:#24202B; --ton:#F4F1EB; --ton2:#B8B1BC;
  /* motion tokens (motion spec §2) */
  --instant:120ms; --fast:180ms; --base:240ms; --slow:360ms; --narrative:420ms; --count:600ms; --sheet:320ms; --tab:160ms; --reduced:80ms;
  --standard:cubic-bezier(.2,0,0,1); --exit:cubic-bezier(.4,0,1,1);
  --sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121018;--fg:#F4F1EB;--muted:#B8B1BC;--rail:#1C1923;--line:#332F3C;--accent:#8E8AF0;--accent-fg:#14121A;--tint:#2B2840;--ok:#4CC2A3;--warn:#E0A24D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121018;--fg:#F4F1EB;--muted:#B8B1BC;--rail:#1C1923;--line:#332F3C;--accent:#8E8AF0;--accent-fg:#14121A;--tint:#2B2840;--ok:#4CC2A3;--warn:#E0A24D;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.45;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px;border-radius:6px}
.app{display:flex;flex-direction:column;height:100%;padding-block:10px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:44px;padding-bottom:8px}
.top .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.top .brand svg{height:26px;width:auto}
.top .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--rail)}
.seg button{padding:6px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted);transition:background var(--fast) var(--standard),color var(--fast) var(--standard)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.tg{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:600}
.tg button{width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;transition:background var(--instant)}
.tg button::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform var(--instant) var(--standard)}
.tg button[aria-pressed="true"]{background:var(--accent)}
.tg button[aria-pressed="true"]::after{transform:translateX(16px)}
.mobbtn{display:none;padding:7px 14px;border:1px solid var(--line);border-radius:999px;font-weight:600;font-size:13px;background:var(--rail)}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:250px minmax(0,1fr) 310px;gap:20px}
.rail{background:var(--rail);border:1px solid var(--line);border-radius:16px;overflow:auto;padding:14px;min-height:0}
.rail h3{margin:14px 0 6px;font-size:13px;font-weight:700;color:var(--muted)}
.rail h3:first-child{margin-top:0}
.tour button{display:flex;width:100%;text-align:left;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;font-size:14px;font-weight:600}
.tour button:hover{background:var(--tint)}
.tour button[aria-current="true"]{background:var(--accent);color:var(--accent-fg)}
.tour small{font-weight:500;opacity:.7;margin-left:auto;font-size:12px}
.stage{display:flex;justify-content:center;align-items:flex-start;min-height:0;overflow:hidden}
.phone{position:relative;width:375px;height:780px;flex:none;background:var(--mineral);color:var(--carbon);border-radius:40px;border:8px solid #18151F;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(24,21,31,.18);transform-origin:top center}
.sb{height:44px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 22px 6px;font-family:var(--mono);font-size:13px;font-weight:500}
.sb.dk{color:var(--ton)}
.sb .ic{display:flex;gap:5px;align-items:center}
.scr{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;padding:6px 16px 20px;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.scr.dk{background:var(--dk1);color:var(--ton)}
.phone.dkp{background:var(--dk1)}
.tabs{flex:none;height:64px;border-top:1px solid var(--bsoft);background:var(--surface);display:flex}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--t2);transition:color var(--tab)}
.tabs button[aria-current="true"]{color:var(--indigo)}
.tabs svg{width:22px;height:22px}
/* type */
.h1{font-size:26px;line-height:1.18;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.h2{font-size:19px;line-height:1.25;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.h3{font-size:16px;line-height:1.3;font-weight:700}
.p{font-size:15px;line-height:1.45}
.sm{font-size:13px;line-height:1.4;color:var(--t2)}
.xs{font-size:12px;line-height:1.35;color:var(--t2)}
.mono{font-family:var(--mono)}
.big{font-size:56px;line-height:1;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.mid{font-size:34px;line-height:1;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.sp1{flex:1}
.card{background:var(--surface);border:1px solid var(--bsoft);border-radius:20px;padding:16px}
.card.flat{background:var(--subtle);border-color:transparent}
.card.dk{background:var(--dk1);color:var(--ton);border-color:transparent}
.card.dk .sm,.card.dk .xs{color:var(--ton2)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:12px 18px;border-radius:12px;background:var(--indigo);color:#fff;font-weight:700;font-size:16px;text-align:center;transition:transform var(--instant) var(--standard),background var(--instant) var(--standard),opacity var(--fast)}
.btn:active{transform:scale(.98);background:var(--indigo7)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sec{background:transparent;color:var(--carbon);border:1.5px solid var(--bstrong)}
.btn.sec:active{background:var(--subtle)}
.btn.onk{background:var(--ton);color:var(--carbon)}
.btn.onk:active{background:#fff}
.txt{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 10px;font-weight:600;font-size:14px;color:var(--indigo)}
.txt.mute{color:var(--t2);white-space:nowrap;flex:none}
.dk .txt{color:#C7C4F7}.dk .txt.mute{color:var(--ton2)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--bstrong);font-weight:600;font-size:14px;background:transparent;transition:background var(--fast) var(--standard),color var(--fast) var(--standard),border-color var(--fast);text-align:left}
.chip:active{transform:scale(.98)}
.chip[aria-pressed="true"],.chip.on{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.back{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;margin-left:-10px}
.hdr{display:flex;align-items:center;gap:6px;min-height:48px}
.hdr .ttl{font-weight:700;font-size:17px;flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--itint);color:var(--indigo7);font-size:12px;font-weight:700}
.nar{display:flex;gap:10px;align-items:flex-start}
.her{display:block;width:24px;height:42px;flex:none;overflow:visible}
.her .a,.her .b{fill:#18151F}.her .d{fill:#4B46D8}
.on-dark .her .a,.on-dark .her .b{fill:#F4F1EB}.on-dark .her .d{fill:#F47A66}
.her.sm1{width:18px;height:31px}.her.lg{width:36px;height:63px}.her.xl{width:58px;height:101px}
.buddy{display:inline-flex;transform-origin:50% 90%}
.buddy.miss{opacity:.6;transform:rotate(8deg);transition:opacity var(--base) var(--standard),transform var(--base) var(--standard)}
.noticed{display:flex;gap:10px;align-items:flex-start}
.noticed i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--coral);margin-top:7px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.mk{display:none;font-style:normal;font-family:var(--mono);font-size:10px;font-weight:600;padding:1px 5px;border-radius:5px;vertical-align:2px;margin-left:4px;white-space:nowrap}
.review .mk{display:inline-block}
.mk.m{background:#E0DCE9;color:#3C37A0}.mk.c{background:#F4DCD4;color:#8A2D1B}.mk.k{background:#FBE9B7;color:#6B4A00}.mk.l{background:#D5EEE6;color:#0F5A49}
.dk .mk.m,.card.dk .mk{opacity:.95}
.lk{width:100%;border-radius:16px;overflow:hidden}
/* check-in rows */
.crow{background:var(--surface);border:1px solid var(--bsoft);border-radius:16px;padding:10px 8px 8px}
.crow .q{display:flex;align-items:center;gap:8px;padding:0 6px 8px;font-weight:700;font-size:15px}
.crow .q svg{width:18px;height:18px;color:var(--carbon)}
.crow .q em{margin-left:auto;font-style:normal;font-weight:500;font-size:12px;color:var(--t2)}
.seg5{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.seg5 button{position:relative;min-height:46px;padding:6px 2px;border-radius:10px;background:var(--subtle);font-size:11px;font-weight:600;line-height:1.15;letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;text-align:center;transition:background var(--instant) var(--standard),color var(--instant) var(--standard);overflow-wrap:normal}
.seg5 button:active{transform:scale(.98)}
.seg5 button.sel{background:var(--indigo);color:#fff}
.seg5 button.y::after{content:"";position:absolute;top:3px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--indigo);opacity:.35}
.seg5 button.sel.y::after{background:#fff;opacity:.55}
.prog{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;color:var(--t2)}
.prog b{display:flex;gap:4px}
.prog b i{width:9px;height:9px;border-radius:50%;background:var(--bsoft);transition:background var(--instant)}
.prog b i.on{background:var(--indigo)}
/* sheets and overlays */
.scrim{position:absolute;inset:0;background:rgba(24,21,31,.48);opacity:0;transition:opacity var(--base) var(--standard);z-index:20}
.scrim.in{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow-y:auto;background:var(--mineral);border-radius:24px 24px 0 0;padding:10px 18px 22px;z-index:21;transform:translateY(100%);transition:transform var(--sheet) var(--standard);scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.sheet.in{transform:none}
.sheet.out{transform:translateY(100%);transition-duration:var(--base);transition-timing-function:var(--exit)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--bsoft);margin:0 auto 10px}
.toast{position:absolute;left:16px;right:16px;bottom:78px;background:var(--carbon);color:var(--ton);padding:12px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:40;animation:rise var(--base) var(--standard) both}
.toast.out{animation:fadeout var(--base) var(--exit) both}
.hap{position:absolute;left:12px;top:50px;z-index:50;font-family:var(--mono);font-size:11px;font-weight:600;background:#18151F;color:#F4F1EB;border-radius:8px;padding:3px 8px;opacity:0;pointer-events:none}
.hap.go{animation:hap 800ms var(--standard) both}
@keyframes hap{0%{opacity:0;transform:translateY(4px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
/* motion */
@keyframes enter{from{opacity:.55;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:.55;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes fadeout{to{opacity:0}}
@keyframes nod{0%{transform:none}40%{transform:translateY(4px)}100%{transform:none}}
@keyframes arrive{0%{transform:translateY(-14px) scale(.92);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes drawchk{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}
@keyframes shift{from{opacity:.55;transform:translateX(24px)}to{opacity:1;transform:none}}
.e{animation:enter var(--base) var(--standard) both;animation-delay:calc(var(--i,0)*50ms)}
.rise{animation:rise var(--base) var(--standard) both}
.fin{animation:fadein var(--fast) var(--standard) both}
.nod{animation:nod var(--narrative) var(--standard) both}
.arrive{animation:arrive var(--narrative) var(--standard) both}
.step{animation:shift var(--base) var(--standard) both}
.dots{display:inline-flex;gap:4px;align-items:center;height:14px}
.dots i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.ring{display:block}
.ring .trk{stroke:var(--bsoft)}.ring .arc{stroke:var(--indigo);transition:stroke-dashoffset var(--count) var(--standard)}
.dk .ring .trk,.card.dk .ring .trk{stroke:#3A3545}.dk .ring .arc,.card.dk .ring .arc{stroke:#9C98F2}
.chk path{stroke-dasharray:30;stroke-dashoffset:0}
.chk.draw path{animation:drawchk var(--base) var(--standard) both}
.fold{overflow:hidden;transition:max-height var(--base) var(--standard),opacity var(--base) var(--standard)}
.hold{position:relative;overflow:hidden;touch-action:none;user-select:none}
.hold .fill{position:absolute;inset:0;background:var(--indigo7);transform:scaleX(0);transform-origin:left;transition:transform var(--count) var(--standard)}
.hold.press .fill{transform:scaleX(1)}
.hold span{position:relative}
/* chat */
.bub{max-width:88%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.4}
.bub.me{background:var(--indigo);color:#fff;align-self:flex-end;border-bottom-right-radius:6px;width:auto;height:auto;flex:none}
.bub.nari{background:var(--surface);border:1px solid var(--bsoft);align-self:flex-start;border-bottom-left-radius:6px}
.fact{font-family:var(--mono);font-size:10.5px;color:var(--t2);margin-top:4px;align-self:flex-start;max-width:92%}
.msgs{display:flex;flex-direction:column;gap:10px;padding:10px 0}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th,.table td{padding:8px 6px;border-bottom:1px solid var(--bsoft);text-align:left;vertical-align:top}
.table th{font-weight:700;color:var(--t2);font-size:12px}
.sel-card{border:1.5px solid var(--bstrong);border-radius:16px;padding:12px 14px;text-align:left;width:100%;background:var(--surface);transition:border-color var(--fast),background var(--fast)}
.sel-card[aria-pressed="true"]{border-color:var(--indigo);background:var(--itint)}
.ck{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:6px 0;min-height:44px}
.ck i{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--bstrong);display:flex;align-items:center;justify-content:center;background:var(--surface);transition:background var(--instant),border-color var(--instant)}
.ck[aria-checked="true"] i{background:var(--indigo);border-color:var(--indigo)}
.ck i svg{width:14px;height:14px;opacity:0}
.ck[aria-checked="true"] i svg{opacity:1}
.step-n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--itint);color:var(--indigo7);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.tl{display:flex;flex-direction:column;gap:14px}
.tl>div{display:flex;gap:12px}
.err{color:var(--crit);font-weight:600;font-size:13px}
/* rails content */
.nt h2{font-size:17px;margin:0 0 4px;font-weight:800}
.nt p{margin:4px 0;color:var(--muted);font-size:13px}
.nt ul{margin:4px 0 8px;padding-left:18px;font-size:13px}
.nt li{margin:2px 0}
.nt code{font-family:var(--mono);font-size:11.5px;background:var(--tint);padding:1px 5px;border-radius:5px}
.beforeimg{width:100%;height:100%;object-fit:contain;background:#fff;display:block}
.ribbon{position:absolute;top:50px;left:0;right:0;text-align:center;z-index:30;font-weight:700;font-size:12px;background:#FBE9B7;color:#6B4A00;padding:4px}
.test .rail,.test .rv{display:none}
.test .grid{grid-template-columns:minmax(0,1fr)}
.sig{font-size:12px;font-weight:700;color:var(--muted)}
.drawer-x{display:none}
@media (max-width:900px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .rail{display:none;position:fixed;inset:0;z-index:100;border-radius:0;padding:20px max(16px,env(safe-area-inset-left,0px))}
  .rail.open{display:block}
  .drawer-x{display:inline-flex;position:sticky;top:0;float:right}
  .mobbtn{display:inline-flex}
  .phone{width:100%;max-width:400px;height:100%;border-width:6px;border-radius:30px}
  .stage{align-items:stretch}
}
@media (prefers-reduced-motion:reduce){
  .e,.rise,.fin,.nod,.arrive,.step,.toast{animation-name:fadein;animation-duration:var(--reduced)!important;animation-delay:0s!important}
  *{transition-duration:var(--reduced)!important}
  .sheet{transition-duration:var(--reduced)!important}
}
.rm .e,.rm .rise,.rm .fin,.rm .nod,.rm .arrive,.rm .step,.rm .toast{animation-name:fadein;animation-duration:var(--reduced)!important;animation-delay:0s!important}
.rm *{transition-duration:var(--reduced)!important}
.rm .sheet{transition-duration:var(--reduced)!important}
.rm .dots i{animation:none;opacity:.7}
.rm .hold .fill{transition-duration:0s!important}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
.hold:not(.press) .fill{transition-duration:180ms}
.test .mobbtn{display:none}

/* ===== design-depth pass (R177, R178): hero blocks, art, value stacks, tickets, story ===== */
.h0{font-size:40px;line-height:1.02;font-weight:800;letter-spacing:-.035em;text-wrap:balance}
.h0.sm0{font-size:33px}
.hero{position:relative;border-radius:28px;padding:20px 20px 0;overflow:hidden;display:flex;flex-direction:column;gap:8px}
.hero.ind{background:var(--itint)}.hero.cor{background:var(--ctint)}.hero.dk{background:var(--dk1);color:var(--ton)}.hero.sub{background:var(--subtle)}
.hero .lede{font-size:15px;line-height:1.4;margin:0;opacity:.88}
.hero .art{display:block;width:100%;height:auto;margin-top:4px}
.art{display:block}
.blk{border-radius:24px;padding:16px 18px}
.blk.cor{background:var(--ctint)}.blk.ind{background:var(--itint)}.blk.dk{background:var(--dk1);color:var(--ton)}.blk.sub{background:var(--subtle)}.blk.srf{background:var(--surface);border:1px solid var(--bsoft)}
.blk.dk .sm,.blk.dk .xs{color:var(--ton2)}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bento .wide{grid-column:1/-1}
.tl2{display:flex;gap:10px;align-items:flex-start;padding:7px 0}
.tk{flex:none;width:22px;height:22px;border-radius:50%;background:var(--pos);color:#fff;display:inline-flex;align-items:center;justify-content:center;margin-top:1px}
.pr{margin-left:auto;padding-left:8px;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.strike{text-decoration:line-through;color:var(--t2);font-weight:600}
.ticket{position:relative;background:var(--surface);border:1.5px solid var(--carbon);border-radius:26px;padding:18px 18px 16px}
.ticket.dk{background:var(--dk1);color:var(--ton);border-color:var(--dk1)}
.ticket.dk .sm,.ticket.dk .xs{color:var(--ton2)}
.perf{position:relative;margin:14px -18px;border-top:2px dashed var(--bstrong)}

};

function doPayoff(auto){

function chart(){
 const d=D(),pts=SC.slice(0,d.day),W=320,H=150,L=26,R=88,T=12,B=22,lo=40,hi=70,x=i=>L+(pts.length>1?i*(W-L-R)/(pts.length-1):0),y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
 const band=d.usual!=null?`<rect x="${L}" y="${y(d.usual+4)}" width="${W-L-R}" height="${y(d.usual-4)-y(d.usual+4)}" fill="#E0DCE9" opacity=".7"/><text x="${W-R+6}" y="${y(d.usual)+4}" font-size="11" font-weight="600" fill="#3C37A0">Your usual ${d.usual}</text>`:'';
 const line=pts.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
 const last=pts.length-1;
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Your Chi score over ${pts.length} days">${[40,50,60,70].map(g=>`<line x1="${L}" x2="${W-R}" y1="${y(g)}" y2="${y(g)}" stroke="#DDD8CF" stroke-width="1"/><text x="${L-6}" y="${y(g)+4}" font-size="10" text-anchor="end" fill="#67616D">${g}</text>`).join('')}${band}<path d="${line}" fill="none" stroke="#4B46D8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" id="cl" style="stroke-dasharray:600;stroke-dashoffset:${RMon()?0:600};transition:stroke-dashoffset 600ms cubic-bezier(.2,0,0,1)"/>${pts.map((v,i)=>i===last?`<circle cx="${x(i)}" cy="${y(v)}" r="5.5" fill="#4B46D8"/><text x="${x(i)+9}" y="${y(v)+4}" font-size="12" font-weight="700" fill="#18151F">${v} today</text>`:`<circle cx="${x(i)}" cy="${y(v)}" r="2.5" fill="#4B46D8"/>`).join('')}<text x="${L}" y="${H-4}" font-size="10" fill="#67616D">day 1</text><text x="${x(last)}" y="${H-4}" font-size="10" text-anchor="middle" fill="#67616D">day ${d.day}</text></svg>`;
}

SCREENS.lookback=()=>{
 const d=D();
 if(d.day<7)return `${hdr('Your week')}<div class="card" data-e><div class="h2">Nily learns your usual in ${d.learn} more check-ins.</div><p class="p" style="margin:8px 0 0">Your first week isn't done yet. When it is, you'll see your range, your best day and why, and what your usual is.</p></div>`;
 const w=SC.slice(d.day-7,d.day),days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],start=(d.day-7)%7,lbl=w.map((_,i)=>days[(start+i)%7]),lo=Math.min(...w),hi=Math.max(...w),bi=w.indexOf(hi),u=d.usual;
 const H=120,sc=v=>(v-40)/(70-40)*H;

 return C[k]}
async function playConv(i){
 const run=S.chat.run;if(S.chat.playing||S.left<=0)return;S.chat.playing=true;S.chat['p'+i]=true;chatUI();
 const cv=CONV[i];S.review&&addMsg(`<div class="xs" style="align-self:center;color:var(--t2)">Example conversation · ${cv.who}</div>`);
 for(const st of cv.steps){
  if(run!==S.chat.run)return;
  if(st.h){await sleep(700);if(run!==S.chat.run)return;S.left--;addMsg(`<div class="bub me rise">${st.h}</div>`);chatUI()}
  else if(st.n){addMsg(`<div class="bub nari" id="typing" style="width:64px"><span class="dots"><i></i><i></i><i></i></span></div>`);await sleep(1100);if(run!==S.chat.run)return;const t=$('#typing');if(t){t.remove()}S.chat.html=S.chat.html.replace(/<div class="bub nari" id="typing"[\s\S]*?<\/div>/,'');addMsg(`<div class="bub nari rise">${st.n}${st.mem?`<div class="xs" style="margin-top:6px;color:var(--indigo7);font-weight:600">${st.mem}</div>`:''}${st.c?mk('c'):''}</div>${factTag(st.f)}`)}
  else if(st.card){await sleep(500);if(run!==S.chat.run)return;addMsg(cardHTML(st.card)+factTag(st.f))}
 }
 S.chat.playing=false;
 if(S.left<=0){await sleep(700);if(run===S.chat.run){addMsg(`<div class="bub nari rise">That's your messages for today. I'll be here again tomorrow morning.</div>`+cardHTML('plus')+factTag('A.15 chat: Plus ✓ over quota only'))}}
 chatUI();
}

SCREENS.lookback=()=>{
 const d=D();
 if(d.day<7)return `${hdr('Your week')}<div class="blk ind" data-e><div class="h0 sm0">Nily learns your usual in ${d.learn} more check-ins.</div><p class="p" style="margin:8px 0 0">Your first week isn't done yet. When it is, you'll see your range, your best day and why, and what your usual is.</p></div>`;
 const w=SC.slice(d.day-7,d.day),days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],start=(d.day-7)%7,lbl=w.map((_,i)=>days[(start+i)%7]),lo=Math.min(...w),hi=Math.max(...w),bi=w.indexOf(hi),u=d.usual,full=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][(start+bi)%7],sl=Math.min(2,S.wslide||0);
 const bars=`<div class="bars">${[0,1,2].map(i=>`<i class="${i<=sl?'on':''}"></i>`).join('')}</div>`;
 const X=`<button class="xbtn" type="button" data-a="wclose" aria-label="Close">${ic('x',24)}</button>`,T=`<div class="tapz"><button type="button" data-a="wprev" aria-label="Previous"></button><button type="button" data-a="wnext" aria-label="Next"></button></div>`;
 const wk=`<div class="wk">${w.map((v,i)=>`<div class="${i===bi?'top':''}" style="height:${(v-40)/30*130}px;${RMon()?'':'animation:grow 600ms cubic-bezier(.2,0,0,1) both;animation-delay:'+(i*50)+'ms'}"></div>`).join('')}</div><div class="dayrow">${lbl.map(l=>`<div>${l}</div>`).join('')}</div>`;
 if(sl===0)return `<div class="story step">${bars}${X}<div style="margin-top:34px"><div class="sm" style="color:var(--ton2);font-weight:700">Your week, Priya</div><div class="bigw" style="margin-top:8px">${lo}–${hi}</div><p class="p" style="margin:12px 0 0;color:var(--ton)">${d.day===7?'Nily has learned your usual — '+u+'. Your score now means something.':'Your usual is '+u+'. Five points either way is a real change.'}</p></div><div style="margin-top:auto">${wk}</div><div class="xs" style="text-align:center;color:var(--ton2)">Tap to continue</div>${T}</div>`;
 if(sl===1)return `<div class="story ind step">${bars}${X}<div style="margin-top:34px"><div class="p" style="font-weight:700;opacity:.85">Your best day</div><div class="bigw" style="margin-top:8px;font-size:min(64px,15vw)">${full}</div><div class="h0" style="margin-top:6px;font-size:54px">${hi}</div><div class="pull" style="margin-top:14px"><div class="p" style="font-weight:700">Nily saw your longest sleep the night before.${mk('c')}</div></div></div><div style="margin-top:auto">${art('night',150,'#4B46D8')}</div><div class="xs" style="text-align:center;opacity:.8">Tap to continue</div>${T}</div>`;
 return `<div class="story cor step">${bars}${X}<div style="margin-top:34px"><div class="p" style="font-weight:700">This is you</div><div class="bigw" style="margin-top:8px;color:var(--carbon)">${u}</div><div class="h3" style="margin-top:8px;font-size:22px">is your usual.</div><p class="p" style="margin:10px 0 0">Nily learned it from your own check-ins. Not from other women.</p></div><div style="margin-top:auto">${art('friend')}</div><p class="p" style="margin:0;font-weight:800;font-size:17px">Your week, ready whenever you want someone — a friend or a doctor — to see it.</p><button class="btn" type="button" data-a="toast" data-v="Your phone's share sheet opens here. The card shows your week, nothing you typed." style="min-height:58px;font-size:17px;font-weight:800;border-radius:18px;position:relative;z-index:3">Share my week</button></div>`;
};

/* ===== pass 3 (R179, R180): her Chi as a living picture; new scenes; "How Nily understands you" ===== */
const AREAS=['Mood','Sleep','Energy','Focus','Stress','Body'];
const star=(x,y,r,f)=>`<path d="M${x} ${y-r} Q${x} ${y} ${x+r} ${y} Q${x} ${y} ${x} ${y+r} Q${x} ${y} ${x-r} ${y} Q${x} ${y} ${x} ${y-r}Z" fill="${f}"/>`;
function chiVals(){const d=[3,1,1,2,2,2];return ['mood','sleep','energy','focus','stress','body'].map((k,i)=>S.ans[k]!=null?S.ans[k]:d[i])}
/* the Chi bloom: six arches, one per part of her, growing from the centre; the dashed ring is her usual */
function bloom(size=240,o={}){
 const vals=o.vals||chiVals(),known=o.known||[1,1,1,1,1,1],cx=size/2,cy=size/2,w=size*.13,k=w/465,r0=size*.15,ink=o.dark?'#F4F1EB':'#18151F',mute=o.dark?'#B8B1BC':'#8A857D',hOf=v=>553*k*(.5+v*.32);
 let s=`<circle cx="${cx}" cy="${cy}" r="${(r0+hOf(2)+2).toFixed(1)}" fill="none" stroke="${mute}" stroke-width="1.4" stroke-dasharray="3 5"/>`;
 vals.forEach((v,i)=>{const a=i*60,low=v<2,h=hOf(v),sy=k*(.5+v*.32);
  const body=known[i]?`<path d="${AR}" fill="${low?'#9C98F2':(o.dark?'#9C98F2':'#4B46D8')}" transform="scale(${k} ${sy}) translate(-298.5 -800)"/><circle cx="${(w*.1).toFixed(1)}" cy="${(-h-w*.2).toFixed(1)}" r="${(w*.16).toFixed(1)}" fill="${low?'#F15D45':ink}"/>`
   :`<path d="${AR}" fill="none" stroke="${mute}" stroke-width="${(1.3/k).toFixed(1)}" stroke-dasharray="${(6/k).toFixed(0)} ${(9/k).toFixed(0)}" transform="scale(${k} ${(k*1.15).toFixed(5)}) translate(-298.5 -800)"/>`;
  s+=`<g transform="rotate(${a} ${cx} ${cy}) translate(${cx} ${(cy-r0).toFixed(1)})"><g class="petal" style="animation-delay:${i*50}ms">${body}</g></g>`;
  if(o.labels){const ang=(a-90)*Math.PI/180,rr=r0+hOf(4)+17;s+=`<text x="${(cx+rr*Math.cos(ang)).toFixed(1)}" y="${(cy+rr*Math.sin(ang)+4).toFixed(1)}" text-anchor="middle" font-family="Plus Jakarta Sans,sans-serif" font-size="11" font-weight="700" fill="${ink}">${AREAS[i]}</text>`}
 });
 return `<svg class="art" viewBox="0 0 ${size} ${size}" width="100%" role="img" aria-label="Your Chi: six petals for mood, sleep, energy, focus, stress and body. The dashed ring is your usual." style="max-width:${size}px;margin:0 auto">${s}</svg>`;
}
const bloomBlock=(size,o,center)=>`<div style="position:relative;max-width:${size}px;margin:0 auto">${bloom(size,o)}<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column">${center}</div></div>`;
/* her week as stars */
function constel(vals,labels,bi){
 const W=300,H=130,n=vals.length,lo=45,hi=66,pts=vals.map((v,i)=>[20+i*(W-40)/(n-1),H-18-(v-lo)/(hi-lo)*(H-46)]);
 return `<svg class="art" viewBox="0 0 ${W} ${H+20}" width="100%" role="img" aria-label="Your week as stars. Brightest: ${labels[bi]}">${Array.from({length:16},(_,i)=>dc((i*53+11)%300,(i*29+7)%90,1.3,'#F4F1EB',.35)).join('')}<polyline points="${pts.map(p=>p.map(x=>x.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="#F4F1EB" stroke-opacity=".55" stroke-width="1.4" stroke-dasharray="2 5"/>${pts.map((p,i)=>i===bi?star(p[0].toFixed(1),p[1].toFixed(1),15,'#F47A66'):star(p[0].toFixed(1),p[1].toFixed(1),7,'#F4F1EB')).join('')}${pts.map((p,i)=>`<text x="${p[0].toFixed(1)}" y="${H+12}" text-anchor="middle" font-family="Plus Jakarta Sans,sans-serif" font-size="11" font-weight="600" fill="#B8B1BC">${labels[i]}</text>`).join('')}</svg>`}

});

/* ===== team tour: runs only when the link ends in #tour. driver.js 1.9.0 (MIT) is fetched then, never on the plain link. ===== */
(function(){

  if(!ON)return;
  const LIB='https://cdn.jsdelivr.net/npm/driver.js@1.9.0/dist/driver.js.iife.js';
  const SRI='sha384-ewyNpQXsRJ43pjJHon2+kFi6VL21pGLmqQWy90ua6Wftxp4v4AfNiB5iI+32snx5';
  const INIT=JSON.stringify(S), root=document.documentElement, app=$('#app');
  let drv=null, busy=false, loading=null, msgT, run=0;

  const wide=()=>innerWidth>900;

    {h:'One question on the lock screen',t:'The notification never shows a score or a health word. One tap opens the check-in.',o:'Owner: Anji',prep:()=>ensure('lock')},
    {h:'Words, not bars',t:'Six rows, five words each, worst on the left. The ring marks what she said yesterday.',o:'Owner: Anji · Test T-STRESS: Raju',prep:()=>ensure('checkin')},
    {h:'The Chi score, with its meaning',t:'54, a little below her usual of 60. A number never appears without what it means.',o:'Owner: Harsha (usual score) · Words: CCO',settle:800,prep:()=>ensure('payoff')},
    {h:'Today starts with her',t:'Her mood faces first, then what Nily noticed, then one doctor’s call. “Not now” is always one tap.',o:'Owner: Anji · Words: counsel',prep:()=>ensure('today')},
    {h:'A floating dock with three tabs',t:'Today, You and Care, plus a Talk to Nily button. The middle tab is still open for Megh to confirm.',o:'Owner: Megh (question 2 of the Anji audit)',el:'.dock',settle:400,prep:()=>ensure('today')},
    {h:'What the score means',t:'Six petals, one per part of her. The dashed ring is her own usual, never other women.',o:'Owner: CCO',prep:()=>ensure('score')},
    {h:'How Nily understands you',t:'What Nily learned, in her own words and days. “That’s not me” lets her correct it.',o:'Owner: Anji · Strings: Harsha',prep:()=>ensure('knows')},
    {h:'Your week, wrapped',t:'Three cards she can share. Her usual is 60; five points either way is a real change.',o:'Owner: Anji',prep:()=>ensure('lookback')},
    {h:'Nily, the companion',t:'A one-line disclosure sits on top. The chat opens from today’s data and ends in a clear offer.',o:'Owner: Counsel · Chat examples: CCO',settle:300,prep:()=>ensure('chat')},
    {h:'What the ₹499 includes',t:'Everything she gets is listed in plain words before she is asked to pay.',o:'Owner: CCO (who) · Naresh (windows)',prep:()=>ensure('call')},
    {h:'Nothing is pre-ticked',t:'Both boxes start empty and Pay waits for the first. Moving and cancelling are explained first.',o:'Owner: Counsel · Harsha (two order promises)',prep:()=>ensure('order')},
    {h:'Nari Plus, renewal in plain sight',t:'₹3,999 a year or ₹399 a month, with the renewal line beside the button.',o:'Owner: Counsel · Anji (store billing)',prep:()=>ensure('plus')},
    {h:'Nari Tests: an assessment',t:'Not a diagnosis. ₹999, or any two for ₹1,499. Reviewed by a psychologist.',o:'Owner: CCO',prep:()=>ensure('test')},
    {h:'Care Plan: the sum is shown',t:'₹7,192 of care for ₹6,999, or ₹6,500 after an eligible ₹499 call.',o:'Owner: Counsel · Naresh',prep:()=>ensure('plan')},
    {h:'That’s the tour',t:'The left list opens any screen. Reset demo starts over.',o:'',prep:()=>{}}
  ];
  const N=STEPS.length-1;   /* numbered steps; the last popover has no number */

  function msg(text,ms){ const m=$('#ntMsg'); if(!m)return; m.textContent=text||''; clearTimeout(msgT); if(text&&ms)msgT=setTimeout(()=>{m.textContent=''},ms); }
  /* phone scale: fits the window height, and leaves room on the right for the popover (about 720px beside the phone) */
  function sizePhone(){ root.style.setProperty('--nt-k',String(Math.max(0.62,Math.min(1,(innerHeight-86)/796,(innerWidth-720)/375)))); }

  /* back to a clean start: initial state, start screen, demo day 9, Review mode; the viewer's reduced-motion switch is kept */
  function resetDemo(){
    const rm=S.rm, crun=((S.chat&&S.chat.run)||0)+1;
    for(let t=setTimeout(function(){},0);t>0;t--){clearTimeout(t);clearInterval(t)}   /* pending chat reply, payoff entry, hold start */
    Object.keys(S).forEach(k=>{delete S[k]});
    Object.assign(S,JSON.parse(INIT)); S.seen={}; S.rm=rm; S.chat.run=crun;
    setMode(true);
  }

  function loadLib(){
    if(window.driver&&window.driver.js)return Promise.resolve();
    if(loading)return loading;
    loading=new Promise((ok,bad)=>{
      const s=document.createElement('script'); s.src=LIB; s.integrity=SRI; s.crossOrigin='anonymous';
      s.onload=()=>(window.driver&&window.driver.js&&window.driver.js.driver)?ok():bad(new Error('driver.js missing after load'));
      s.onerror=()=>bad(new Error('driver.js blocked or offline'));
      document.head.appendChild(s);
    });
    loading.catch(()=>{loading=null});
    return loading;
  }

  async function goStep(i,first){
    if(busy||!drv||i<0||i>=STEPS.length)return;
    const my=run; busy=true; document.body.classList.add('nt-busy');
    try{
      const s=STEPS[i];
      try{s.prep()}catch(e){console.error('tour prep',e)}
      await wait(RMon()?100:(s.settle||150));
      if(my!==run)return;                    /* tour was closed while this step was loading */
      if(first)drv.drive(i); else if(drv.isActive())drv.moveTo(i);
    }finally{ busy=false; document.body.classList.remove('nt-busy'); }
  }
  /* pinned popover on narrow screens: keep room for it under the phone */
  function fitPop(){
    const p=document.querySelector('.driver-popover');
    if(wide()||!p)root.style.removeProperty('--nt-h'); else root.style.setProperty('--nt-h',(p.offsetHeight+28)+'px');
  }

  function decorate(pop,o){
    const i=o.state.activeIndex, last=i===N;
    pop.wrapper.setAttribute('role','dialog'); pop.wrapper.setAttribute('aria-modal','true'); pop.wrapper.setAttribute('aria-label','Guided tour');
    pop.progress.textContent=last?'':'Step '+(i+1)+' of '+N;
    $$('.nt-bar,.nt-aux',pop.wrapper).forEach(x=>x.remove());
    pop.title.insertAdjacentHTML('beforebegin','<div class="nt-bar" aria-hidden="true"><i style="width:'+Math.round((last?N:i+1)/N*100)+'%"></i></div>');
    const aux=document.createElement('div'); aux.className='nt-aux';
    aux.innerHTML=(last?'':'<button type="button" data-nt="skip">Skip tour</button>')+'<button type="button" data-nt="reset">Reset demo</button>';
    aux.addEventListener('click',e=>{
      const b=e.target.closest('[data-nt]'); if(!b||busy)return;
      if(b.dataset.nt==='skip')drv.destroy();
      else { resetDemo(); goStep(0); }
    });
    pop.wrapper.appendChild(aux);
    fitPop(); if(!wide())requestAnimationFrame(()=>{ if(drv&&drv.isActive())drv.refresh(); });
  }

  function cleanup(){
    run++; app.inert=false; app.classList.remove('nt-on'); root.classList.remove('nt-on'); root.style.removeProperty('--nt-h'); document.body.classList.remove('nt-busy');
    busy=false; fit();
    requestAnimationFrame(()=>{ const g=$('#ntGo'); if(g)g.focus(); });
  }

  async function startTour(){
    if(drv&&drv.isActive())return;
    if(innerHeight<520){ msg('This window is too short for the tour. Make it taller, or hold the phone upright.'); return; }
    msg('Loading the tour…');
    try{ await loadLib(); }
    catch(e){ msg('The tour could not load. Everything else works: use the left list.'); return; }
    msg('');
    try{
      resetDemo(); run++; app.classList.add('nt-on'); root.classList.add('nt-on'); sizePhone();
      app.inert=true;   /* the phone and top bar are not reachable by Tab while the tour runs; the popover sits outside #app */
      drv=window.driver.js.driver({
        animate:!RMon(), overlayColor:'#18151F', overlayOpacity:wide()?0.62:0, stagePadding:10, stageRadius:48,
        allowClose:true, allowKeyboardControl:true, overlayClickBehavior:'none', disableActiveInteraction:true, smoothScroll:false,
        popoverClass:'nt-pop', popoverOffset:14, showButtons:['next','previous'], showProgress:true, progressText:'',
        nextBtnText:'Next', prevBtnText:'Back', doneBtnText:'Done',
        steps:STEPS.map((s,i)=>({element:s.el||'#phone',popover:{
          title:s.h, description:'<p class="nt-say">'+s.t+'</p>'+(s.o?'<p class="nt-own">'+s.o+'</p>':''),
          side:'right', align:'center', showProgress:i<N, disableButtons:i===0?['previous']:[]
        }})),
        onNextClick:()=>{ if(drv.getActiveIndex()>=N)drv.destroy(); else goStep(drv.getActiveIndex()+1); },
        onDoneClick:()=>drv.destroy(),
        onPrevClick:()=>goStep(drv.getActiveIndex()-1),
        onPopoverRender:decorate,
        onDestroyed:cleanup
      });
      await goStep(0,true);
    }catch(e){ console.error('tour',e); cleanup(); msg('The tour could not start. Everything else works: use the left list.'); }
  }

  $('.top .sp').insertAdjacentHTML('afterend','<span class="nt-msg" id="ntMsg" role="status" aria-live="polite"></span><button type="button" class="nt-btn p" id="ntGo">Take the 3-minute tour</button><button type="button" class="nt-btn" id="ntReset">Reset demo</button>');
  $('#ntGo').onclick=startTour;
  $('#ntReset').onclick=()=>{ resetDemo(); msg('Demo reset: start screen, day 9.',4000); };
  addEventListener('resize',()=>{

    if(innerHeight<520&&drv&&drv.isActive()){ drv.destroy(); msg('The tour stopped because the window is too short. Make it taller to take it again.'); return; }
    sizePhone(); fitPop();
  });
  Promise.race([document.fonts?document.fonts.ready:Promise.resolve(),wait(1200)]).then(startTour);
})();
